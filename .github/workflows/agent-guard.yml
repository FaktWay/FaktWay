name: Agent guard

# Krok 7 planu automatyzacji (docs/runbooks/agent-kodu.md). PR agenta kodu,
# który zmienia obszar z .github/CODEOWNERS albo kod bez testu, wymaga zgody
# człowieka (etykiety). Zgoda wygasa przy każdym nowym pushu.
#
# pull_request_target: workflow i skrypt pochodzą z gałęzi bazowej, więc PR
# nie może osłabić własnej kontroli. Kod z PR NIE jest tu pobierany ani
# uruchamiany — skrypt czyta tylko listę plików, commity i etykiety przez API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  # Kolejka scalania: agent guard ocenił PR przed wejściem do kolejki (wymagana
  # kontrola PR). Na commicie grupy zadanie jest pominięte, a pominięte
  # zadanie GitHub liczy jako zaliczoną wymaganą kontrolę.
  merge_group:

permissions:
  contents: read

# Jak w „Filtr: straż”: anuluje się tylko przebieg z poprzedniego pushu. Zdarzenia
# etykiet nie anulują niczego, bo anulowany przebieg zostaje na SHA głowy jako
# osobna, czerwona pozycja `statusCheckRollup`. Bez `if:` na etykiety: pominięte
# zadanie liczy się jako zaliczone.
concurrency:
  group: agent-guard-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'synchronize' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  agent-guard:
    name: Agent guard
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # zdjęcie etykiet zgody po nowym pushu agenta
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Domyślnie gałąź bazowa — świadomie NIE ref z PR.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Check agent PR approvals
        run: node scripts/ci/agent-guard.mjs guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
