name: Filtr straż

# Żelazny filtr, krok F2 (docs/koordynacja/PLAN-ZELAZNY-FILTR.md, B5.4).
# Każdy PR: poziom ryzyka prawnego z mapy, pliki z sygnałem poza mapą, zmiany
# chronione (maszyneria filtra, wiedza prawna, wyjątki) z etykietami zgody od
# osób z filtr/zgody.json i karta zmiany prawnej dla PR R1 i R2.
#
# pull_request_target: workflow, skrypt i mapa pochodzą z gałęzi domyślnej,
# więc PR nie osłabi kontroli, która go ocenia. Kod z PR NIE jest tu
# pobierany ani uruchamiany: skrypt czyta przez API tylko dane (lista plików
# z fragmentami zmian, JSON mapy i rejestru, opis, etykiety). Bez sekretów.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  # Kolejka scalania: straż ocenia PR jeszcze raz według mapy, zgód i reguł
  # z rodzica grupy (`merge_group.base_sha`: main albo main z wpisami przed
  # tym PR w kolejce; przy ALLGREEN każdy z nich ma własną ocenę), nie
  # z kodu PR. Bez tego PR ocenione według starszej mapy albo listy zgód
  # wchodziłoby do main bez ponownej oceny, bo kolejka nie wymaga aktualnej
  # gałęzi (przegląd #774, 14.11.2026).
  merge_group:

permissions:
  contents: read

concurrency:
  group: filtr-straz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  straz:
    name: 'Filtr: straż'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # zdjęcie etykiet zgody po nowym pushu
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # PR: domyślnie gałąź bazowa z gałęzi domyślnej, świadomie NIE ref z PR.
          # Kolejka: rodzic grupy (main z wpisami przed PR), NIE commit grupy z kodem PR.
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Straż filtra (mapa, zmiany chronione, zgody, karta)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZDARZENIE: ${{ github.event_name }}
          # refs/heads/gh-readonly-queue/main/pr-<N>-<sha>: ostatni PR w grupie
          # (PR przed nim mają własne wpisy kolejki i własną ocenę).
          GLOWA_KOLEJKI: ${{ github.event.merge_group.head_ref }}
          RODZIC_GRUPY: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$ZDARZENIE" = merge_group ]; then
            # Pusty base_sha dałby checkout commitu grupy, czyli straż z kodu PR.
            if [ -z "$RODZIC_GRUPY" ] || [ "$(git rev-parse HEAD)" != "$RODZIC_GRUPY" ]; then
              echo "Straż nie stoi na rodzicu grupy („${RODZIC_GRUPY:-pusty}”): nie przepuszczam grupy."
              exit 1
            fi
            numer=$(printf '%s' "$GLOWA_KOLEJKI" | sed -n 's#^refs/heads/gh-readonly-queue/[^/]*/pr-\([0-9][0-9]*\)-[0-9a-f]*$#\1#p')
            if [ -z "$numer" ]; then
              echo "Nie odczytałem numeru PR z „$GLOWA_KOLEJKI”: nie przepuszczam grupy bez oceny straży."
              exit 1
            fi
            echo "Kolejka scalania: ponowna ocena PR #$numer"
            node scripts/filtr/straz.mjs --pr "$numer"
          else
            node scripts/filtr/straz.mjs --github
          fi
